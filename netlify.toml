[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serve the PDFs inline so browsers open them in a tab instead of forcing a download.
[[headers]]
  for = "/papers/*"
  [headers.values]
    Content-Disposition = "inline"

[[headers]]
  for = "/cv/*"
  [headers.values]
    Content-Disposition = "inline"

# Long cache for Astro's hashed assets (images, CSS, JS).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
